# .pre-commit-config.yaml for mtt_core
# Prevents committing unformatted or broken code (Python/C++) on the repository branches

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

# C++ Linter & Formatter
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.6
    hooks:
    -   id: clang-format
        types_or: [c++, c, cuda]
        args: ["--style=Google"]

# Python Modern Linter & Fast Formatter
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.285
    hooks:
    -   id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
-   repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
    -   id: black
        args: [--line-length=100]

# ROS 2 Specific XML/Launch formatting
-   repo: https://github.com/tier4/pre-commit-hooks-ros
    rev: v0.8.0
    hooks:
    -   id: prettier-package-xml
    -   id: sort-package-xml
