# ── Trailer detector — V1 (articulation / timon zone) ────────────────────────
# ROI verified in CloudCompare (rsairy frame), with margin added.
# topic: raw RS-Airy cloud so the node works independently of cloud_merger.
# Switch to "/merged_points_filtered" if you want base_link frame.
#
# reference_yaw: set to M_PI (~3.14159) if the timon points along -X (base_link)
#                at zero articulation. Leave 0.0 for rsairy frame (raw angle).
#
# hitch_x/y: position of the hitch pivot in the cloud frame.
#             Used only for sign disambiguation. (0,0) = sensor origin works
#             well for rsairy frame since the pivot is always "ahead" in Z.
#
# pca_ratio_min: reject if the cloud is not elongated enough (sphere-like cloud
#                = no clear axis → noisy angle). Start at 2.0, raise if needed.
trailer_detector_node:
  ros__parameters:
    lidar_topic: "/rsairy_ns/points"

    # ROI verified in CloudCompare (rsairy frame) + margin
    roi_x_min: -0.40
    roi_x_max: -0.15
    roi_y_min: -0.40
    roi_y_max:  0.15
    roi_z_min:  0.40
    roi_z_max:  1.20

    voxel_size:   0.02
    enable_voxel: true

    min_points:    10
    pca_ratio_min: 2.0

    # Hitch position in rsairy frame — (0,0) = sensor origin, good default.
    # Axis is flipped so it points FROM hitch TOWARD the trailer.
    hitch_x: 0.0
    hitch_y: 0.0

    # Subtract from PCA yaw to get angle relative to MTT.
    # Set to the raw PCA angle observed at zero articulation.
    reference_yaw: 0.0

# ── Dual-LiDAR merger ────────────────────────────────────────────────────────
cloud_merger_node:
  ros__parameters:
    target_frame: "base_link"
    sync_tolerance: 0.05      # seconds — drop frame if LiDAR timestamps diverge more

    # Self-filter BB1: tractor chassis (base_link frame: x=forward, y=left, z=up)
    # The trailer is behind the robot (x < -0.90 m) and is preserved.
    # Adjust by watching /merged_points vs /merged_points_filtered in Foxglove.
    bbox_chassis_x: [-0.90, 0.70]
    bbox_chassis_y: [-0.40, 0.40]
    bbox_chassis_z: [-0.10, 0.80]

    # Self-filter BB2: LiDAR cage/mounting structure (tight box at sensor cluster)
    bbox_cage_x: [-0.25, 0.15]
    bbox_cage_y: [-0.20, 0.20]
    bbox_cage_z: [ 0.70, 1.10]
