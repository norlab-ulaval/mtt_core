# Trailer detection configuration
perception:
  ros__parameters:
    lidar_topic: "/rsairy_ns/points"
    output_topic: "trailer/angle"

    # Region of interest for trailer body (in lidar frame, meters)
    roi_x_min: -2.5
    roi_x_max: -0.5
    roi_y_min: -1.0
    roi_y_max: 1.0
    roi_z_min: -0.5
    roi_z_max: 1.0

    # Processing
    voxel_size: 0.05      # meters, downsampling
    min_points: 20        # minimum inliers for valid detection
