# ISAM2 Factor Graph localization configuration for MTT
# NOTE: top-level key must match the node name ("factor_graph_node", see
# factor_graph_node.cpp's Node("factor_graph_node") and localization.launch.py's
# name='factor_graph_node') for ROS 2 to actually apply this block. It was
# previously "localization:", which never matched anything — this whole section
# was silently ignored and the node ran entirely on its declare_parameter() C++
# defaults (which happen to mirror most values below, masking the bug).
factor_graph_node:
  ros__parameters:
    # Sensor enabling (modulaire — toggle each source on/off)
    use_imu_primary: true
    use_track_odom: true
    use_gps: true
    use_gps_heading: true
    use_lidar_odom: true
    use_visual_odom: false     # Enable when ZED VIO is available

    # ISAM2 tuning
    isam2_relinearize_threshold: 0.1
    isam2_relinearize_skip: 10

    # Fixed-lag smoother (OOSM): keys older than this are marginalized. Must
    # exceed the largest expected sensor latency (ICP/ZED/future VSLAM odom)
    # with margin, or a late measurement arrives after its target keyframe has
    # already been marginalized and is silently dropped (keyForStamp clamps to
    # the oldest still-live key instead of crashing, but the correction is lost).
    smoother_lag_seconds: 3.0
    # Warn if a single update() call blocks the shared sensor-callback mutex for
    # longer than this fraction of the publish_rate tick period.
    update_duration_warn_ratio: 0.5

    # IMU noise (XSens MTi-100 specs)
    imu_accel_noise: 0.01      # m/s²/√Hz
    imu_gyro_noise: 0.0001     # rad/s/√Hz
    imu_accel_walk: 0.0001     # m/s³/√Hz
    imu_gyro_walk: 0.000001    # rad/s²/√Hz

    # Track odometry noise (single chenille, high slip)
    odom_linear_noise: 0.15    # m/s — loose because tracked vehicle slips
    odom_angular_noise: 0.10   # rad/s — yaw slip is significant

    # GPS noise (adapts at runtime for RTK Fix/Float)
    gps_position_noise_xy: 1.0   # meters (SPP mode baseline)
    gps_position_noise_z: 2.0    # meters
    gps_heading_noise: 0.05      # radians (~3° for 1.1m baseline)

    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"

    # Topic contract
    imu_topic: "mti100/data"
    track_odom_topic: "mtt_odometry"
    gps_fix_topic: "gps_left/fix"
    gps_heading_topic: "gps/heading"
    lidar_odom_topic: "mapping/icp_odom"
    visual_odom_topic: "zed/zed_node/odom"

    # Output rate (Hz)
    publish_rate: 50.0
    min_imu_samples_per_update: 10

    # Articulation factor graph extensions
    use_articulation: true         # fuse encoder φ into ISAM2 as H(k) state
    use_trailer_pose: true         # fuse trailer/pose (LiDAR RANSAC) as TrailerPoseFactor

    # Articulation noise (φ = hitch yaw angle)
    phi_sigma_hardware: 0.008      # rad — fresh encoder  (≈ ±0.5°)
    phi_sigma_model: 0.035         # rad — stale / model fallback
    phi_sigma_dynamics: 0.015      # rad — random-walk between keyframes
    phi_prior_sigma: 0.5           # rad — initial prior at k=0

    # Pitch state (α = hitch pitch angle, P(k) variable)
    use_pitch_state: true           # add P(k) to ISAM2; use TrailerPoseFactorFull
    pitch_sigma_hardware: 0.020    # rad — pitch potentiometer ADC1 (8-bit, ±1.1°)
    pitch_sigma_timon: 0.060       # rad — 3D line ACP on timon (future LiDAR source)
    pitch_sigma_dynamics: 0.008    # rad — terrain slope changes slowly per keyframe
    pitch_prior_sigma: 0.20        # rad — flat-terrain prior α≈0 at k=0

    # TrailerPoseFactor noise (LiDAR RANSAC trailer pose in base_link)
    trailer_sigma_rot: 0.04        # rad base noise (scaled by 1/√confidence)
    trailer_sigma_trans: 0.10      # m   base noise
    trailer_min_confidence: 0.10   # skip factor below this LiDAR confidence

    # Covariance: extract ISAM2 marginal and publish on localization/odom
    extract_covariance: true

# ─── Trailer Localizer ──
# Computes trailer pose in map frame via SE(3) URDF kinematics.
#
# Two operating modes (switch via tractor_odom_topic + fusion_mode):
#
#   Real-time ICP mode (default):
#     tractor_odom_topic: /mapping/icp_odom
#     fusion_mode: "lidar"  (uses KF-fused output from trailer_detector_node)
#     sigma_phi_lidar: 0.010  (KF steady-state σ, tighter than raw LiDAR)
#
#   Full factor graph mode (offline/precision):
#     tractor_odom_topic: localization/odom
#     fusion_mode: "fused"
#     ISAM2 φ from localization/articulation_angle takes priority automatically.
#
mtt_trailer_localizer_node:
  ros__parameters:
    publish_rate: 50.0             # Hz

    # Tractor pose source
    # Real-time: /mapping/icp_odom (fast, no factor graph needed)
    # Precision:  localization/odom (ISAM2 fused, preferred for offline)
    tractor_odom_topic: "/mapping/icp_odom"

    # φ source selection (used only when ISAM2 φ is stale/unavailable)
    #   hardware: effective_rad from articulation_state
    #   lidar:    lidar_rad from trailer_detector_node KF (hardware+LiDAR fused)
    #   fused:    inverse-variance weighted average of hardware + lidar_rad
    # Use "lidar" here because trailer_detector KF already fuses hardware+LiDAR.
    # "fused" would double-count the hardware encoder.
    fusion_mode: "lidar"

    # φ uncertainty (feeds covariance propagation)
    sigma_phi_hardware: 0.008      # rad — encoder fresh (standalone)
    sigma_phi_lidar: 0.010         # rad — KF steady-state σ (hardware+LiDAR fused)

    # α uncertainty — 3-way priority (potentiometer → LiDAR → flat-terrain prior)
    sigma_alpha_hardware: 0.020    # rad — fresh pitch potentiometer reading (best)
    sigma_alpha_lidar: 0.060       # rad — trailer_pose_node EMA pitch (/trailer/pitch_used)
    sigma_alpha_model: 0.035       # rad — flat-terrain fallback (α=0 prior)

    # Tractor pose covariance fallback (used when ISAM2 publishes zeros)
    default_tractor_sigma_xyz: 0.05  # m
    default_tractor_sigma_rpy: 0.01  # rad

    # ISAM2 φ freshness gate (prefer ISAM2 φ within this window)
    articulation_timeout: 0.5      # s

    # TF output
    trailer_tf_frame: "trailer_body"  # child frame (NOT MTT_remorque — avoids URDF conflict)
    broadcast_tf: true

    # Revolute joint REST values (rad) for the internal URDF-chain replica used by
    # computeDelta(). MUST match mtt_joint_state_builder_node's pitch_rest_rad/
    # yaw_rest_rad/roll_rest_rad in demos/common/config/mtt_driver.yaml (currently
    # 0.0/0.0/0.0 there — NOT the URDF's original joint-axis ±π/2 convention). If that
    # config ever changes again, update these three to match, or the trailer pose here
    # will silently diverge from robot_state_publisher's MTT_remorque frame by ~90°
    # per axis that's out of sync (see commit 349edcd, "fix trailer joint rest angles",
    # which changed the YAML but not this node — verify with computeDelta(0,0) vs the
    # live base_footprint→MTT_remorque TF at zero articulation before trusting this).
    pitch_rest_rad: 0.0
    yaw_rest_rad: 0.0
    roll_rest_rad: 0.0
