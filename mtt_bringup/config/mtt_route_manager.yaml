mtt_route_manager:
  ros__parameters:
    routes_dir: "data/wiln_routes"
    route_file_name: "route.ltr"
    icp_odom_topic: "/mapping/icp_odom"
    health_topic: "/mtt_health"
    selected_mode_topic: "mtt_control/selected_mode"
    selected_source_topic: "mtt_control/selected_source"
    auto_enabled_topic: "mtt_control/auto_mode_enabled"
    deadman_topic: "mtt_control/teleop_deadman"
    obstacle_cloud_topic: "/wiln/obstacles"
    wiln_command_topic: "/wiln/command"
    mark_ready_service: "/mtt_repeat/mark_ready"
    play_line_service: "/mtt_repeat/play_line"
    cancel_service: "/mtt_repeat/cancel"
    request_manual_service: "mtt_control/request_manual"
    icp_timeout_s: 0.75
    health_timeout_s: 1.0
    max_start_distance_m: 2.0
    max_lateral_error_m: 1.25
    max_heading_error_rad: 1.2
    route_error_grace_s: 1.0
    min_obstacle_clearance_m: 0.75
    obstacle_corridor_half_width_m: 0.75
    obstacle_lookahead_m: 4.0
    require_obstacle_clearance: false
    cancel_on_obstacle_clearance: false
    front_obstacle_stop_topic: "/mtt_obstacle/stop_requested"
    front_obstacle_clearance_topic: "/mtt_obstacle/front_clearance_m"
    front_obstacle_status_topic: "/mtt_obstacle/hazard_status"
    front_obstacle_timeout_s: 1.0
    monitor_rate_hz: 10.0
    # Auto-save: at the end of each teach session, publish save:<path> to
    # /wiln/command → wiln_route_node writes .ltr (trajectory) + async .vtk (map).
    # Route name is timestamped: route_YYYY-MM-DD_HHMM/route.ltr
    # A 'latest' symlink is maintained for convenience.
    auto_save_on_teach_stop: true
    teach_state_topic: "/wiln/teach/state"
    # Map-to-map SE(3) relocalization: when loading a route, align the old teach
    # map (.vtk) onto the current live map via ICP and republish the trajectory
    # corrected by T_live_old ∈ SE(3).  Set to false if the mapper is restarted
    # with the same map origin (localization continuation) or for fast debugging.
    auto_relocalize_on_load: false
    relocalize_service: "/mtt_map_relocalizer/relocalize"
    relocalize_timeout_s: 60.0
    # Trajectory sync: subscribe to /wiln/trajectory to keep _active_route.poses
    # in sync with the trajectory WILN actually uses (post-relocalization or reload).
    # This prevents frame mismatches in the pre-replay distance check.
    wiln_trajectory_topic: "/wiln/trajectory"
    # After a route load, LoadMap seeds the ICP at the teach start pose; convergence
    # takes 1-3 scans (~100-300ms). During icp_convergence_grace_s, a distance check
    # failure logs a warning but does NOT block replay (ICP is still settling).
    icp_convergence_grace_s: 8.0
