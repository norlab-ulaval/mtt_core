# Standalone teleop filter defaults for direct mtt_driver launches.
# Live runtime tuning belongs in demos/common/config/mtt_control.yaml.

teleop_cmd_smoother_node:
  ros__parameters:
    input_topic: "cmd_vel/teleop_raw"
    output_topic: "cmd_vel/teleop"

    max_accel_linear:   0.5
    max_accel_angular:  0.8

    input_timeout: 0.4

    rate_hz: 50.0
