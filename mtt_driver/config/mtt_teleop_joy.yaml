# Standalone teleop defaults for direct mtt_driver launches.
# Live runtime tuning belongs in demos/common/config/mtt_control.yaml.
/**:
  ros__parameters:
    max_linear_speed: 0.6
    max_angular_speed: 1.0
    linear_deadband: 0.05
    angular_deadband: 0.08
    linear_expo: 1.2
    angular_expo: 1.6

    deadman_button_index: 5   # RB
    light_button_index: 2     # X
    deadman_releases_estop: false

    linear_axis_index: 1      # left stick vertical
    angular_axis_index: 3     # right stick horizontal
    brake_axis_index: 5       # RT trigger axis

    invert_linear_axis: true
    invert_angular_axis: false
    enable_brake_axis: true

    brake_axis_default: 1.0
