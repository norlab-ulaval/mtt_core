# Standalone driver defaults.
# Live runtime tuning belongs in demos/common/config/mtt_driver.yaml.
mtt_can_node:
  ros__parameters:
    steer_control_mode: closed_loop
    cmd_angular_mode: normalized_steer
    tachometer_mode: real
    invert_inferred_tachometer_direction: false
    # Physical top speed at throttle_byte=230. MUST match speed_servo.yaml max_speed_ms.
    # Update after running characterization (mode: "characterize" in mtt_speed_servo_node).
    max_linear_speed_ms: 5.56
    throttle_deadband: 0.05
    steer_deadband: 0.05
    min_steer_speed_ms: 0.1
    model_wheelbase_m: 2.4
    model_max_articulation_deg: 45.0
    model_speed_response_gain: 3.0
    model_articulation_response_gain: 0.8
    model_brake_gain: 1.0
    model_use_slip_heuristic: true
    model_yaw_slip_base: 0.10
    model_yaw_slip_speed_gain: 0.05
    model_yaw_slip_articulation_gain: 0.15
    model_yaw_slip_min_scale: 0.55
    publish_can_debug: false
    can_debug_topic: mtt_can/debug_frames

mtt_odometry_node:
  ros__parameters:
    steer_control_mode: closed_loop
    cmd_angular_mode: normalized_steer
    pivot_turn_enabled: false
    min_turn_speed_ms: 0.05
    yaw_slip_factor: 1.0
    max_articulation_deg: 45.0
    model_wheelbase_m: 2.4
    model_max_articulation_deg: 45.0
    model_speed_response_gain: 3.0
    model_articulation_response_gain: 0.8
    model_brake_gain: 1.0
    model_use_slip_heuristic: true
    model_yaw_slip_base: 0.10
    model_yaw_slip_speed_gain: 0.05
    model_yaw_slip_articulation_gain: 0.15
    model_yaw_slip_min_scale: 0.55

mtt_joint_state_builder_node:
  ros__parameters:
    publish_rate_hz: 50.0
    articulation_topic: mtt_articulation_angle
    tachometer_topic: mtt_tachometer
    joint_state_topic: joint_states
    pitch_rest_rad: 0.0
    yaw_rest_rad: 0.0
    roll_rest_rad: 0.0
    articulation_sign: 1.0
    max_articulation_deg: 45.0
    trailer_left_link_rest_rad: 0.0
    trailer_right_link_rest_rad: 0.0
    drive_joint_radius_m: 0.0202
    drive_joint_rotation_sign: -1.0
    trailer_wheel_radius_m: 0.0508
    left_wheel_rotation_sign: 1.0
    right_wheel_rotation_sign: 1.0

mtt_articulation_sensor_node:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066FFF373146363143224542-if02"
    baud_rate: 921600
    publish_rate_hz: 50.0
    filter_window_size: 50
    # Convention: positive = LEFT turn (CCW/REP-103), negative = RIGHT.
    # LUT already encodes this correctly (low bits→+48°, high bits→-49°).
    invert_sign: false
    angle_offset_rad: 0.0
    bit_coords: [82.0, 214.0, 313.0, 430.0, 510.0, 600.0, 723.0, 831.0, 929.0, 1028.0, 1128.0, 1201.0, 1306.0, 1410.0, 1529.0, 1628.0, 1737.0, 1826.0, 1906.0, 2016.0, 2119.0, 2226.0, 2337.0, 2443.0, 2520.0, 2617.0, 2716.0, 2815.0, 2908.0, 3052.0, 3106.0, 3258.0, 3323.0, 3408.0]
    angle_coords_deg: [48.0, 43.0, 40.0, 36.0, 35.0, 32.0, 29.0, 25.0, 23.0, 20.0, 18.0, 15.0, 12.0, 9.0, 5.0, 2.0, 0.0, -2.0, -4.0, -7.0, -8.0, -10.0, -14.0, -18.0, -20.0, -21.0, -28.0, -26.0, -30.0, -35.0, -40.0, -43.0, -45.0, -49.0]

    # ── Pitch (ADC1, 8-bit, 0–255) ──
    # Convention: α = 0 at flat terrain (hitch at rest position).
    #             α > 0 = trailer tilts up (robot climbing), α < 0 = tilts down.
    #
    # Calibration method 1 — linear fit (2 measurements sufficient):
    #   1. On flat terrain → read /hardware/articulation_pitch_bits → note bits_flat
    #   2. Tilt to known angle θ_deg → read bits → note bits_tilted
    #   3. pitch_bits_zero   = bits_flat
    #      pitch_deg_per_bit = θ_deg / (bits_tilted - bits_flat)
    #      (negative if potentiometer mounted inverted)
    #
    # Calibration method 2 — full LUT (like yaw, for non-linear pots):
    #   Fill pitch_bit_coords + pitch_angle_coords_deg with measured pairs.
    #   LUT takes priority over linear fit when both are set.
    #
    # Both empty / deg_per_bit=0 → pitch_rad=0 published (uncalibrated).
    # mtt_odometry_node will set pitch_fresh=false → factor graph uses flat prior.
    pitch_invert_sign: false
    pitch_angle_offset_rad: 0.0      # fine-tune zero after calibration
    pitch_bits_zero: 128.0           # TODO: measure ADC1 bits on flat terrain
    pitch_deg_per_bit: 0.0           # TODO: set once calibrated (deg per ADC count)
    # pitch_bit_coords: []           # optional: full LUT (overrides linear fit)
    # pitch_angle_coords_deg: []
